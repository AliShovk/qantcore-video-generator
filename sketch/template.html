<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Caveat';src:url('fonts/Caveat.ttf');font-weight:400 700;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1920px;background:#FFFFFF;overflow:hidden}
svg{position:absolute;inset:0}
#fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;opacity:0;background:#fff}
#fin .url{font-family:'Caveat';font-size:150px;font-weight:700;color:#12161C;letter-spacing:-2px}
#fin .sub{font-family:'Caveat';font-size:44px;color:#5B6B7A;margin-top:-6px}
#cap{position:absolute;left:70px;right:70px;bottom:118px;text-align:center;font-family:'Caveat';
  font-size:54px;font-weight:700;color:#12161C;opacity:0}
</style></head>
<body>
<div id="stage">
  <svg id="paper" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div id="fin"><div class="url">qantcore.space</div><div class="sub">/*SUBTITLE*/</div></div>
  <div id="cap"></div>
</div>
<script src="lib/rough.js"></script>
<script>
const DATA = /*SCENE*/;
const SC = DATA.scene, CAPS = DATA.caps || [];
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('paper');
const groups = [];

function g(opts) { const el = document.createElementNS(NS, 'g'); svg.appendChild(el); return el; }

function txt(parent, x, y, s, size, color, rot, anchor, weight) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('font-family', "'Caveat','Comic Sans MS',cursive");
  t.setAttribute('font-size', size); t.setAttribute('font-weight', weight || 700);
  t.setAttribute('fill', color); t.setAttribute('text-anchor', anchor || 'start');
  t.setAttribute('transform', `rotate(${rot || 0} ${x} ${y})`);
  t.textContent = s; parent.appendChild(t); return t;
}

function fit(parent, x, y, s, maxw, size, color, anchor, rot) {
  let t = txt(parent, x, y, s, size, color, rot, anchor, 700);
  const w = t.getComputedTextLength();
  if (w > maxw) { const k = maxw / w; t.setAttribute('font-size', (size * k).toFixed(1)); }
  return t;
}

function arrowHead(parent, x1, y1, x2, y2, color, w) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 26, sp = 0.42;
  [[x2 - L * Math.cos(a - sp), y2 - L * Math.sin(a - sp)],
   [x2 - L * Math.cos(a + sp), y2 - L * Math.sin(a + sp)]].forEach(([px, py]) => {
    parent.appendChild(rough.svg(svg).line(x2, y2, px, py,
      {stroke: color, strokeWidth: w, roughness: 1.4}));
  });
}

function doodle(parent, shape, x, y, s, o) {
  const R = (a, b, c, d, opt) => parent.appendChild(rough.svg(svg).line(a, b, c, d, opt || o));
  const C = (cx, cy, w, h, opt) => parent.appendChild(rough.svg(svg).ellipse(cx, cy, w, h, opt || o));
  if (shape === 'person') {
    C(x, y, 78 * s, 78 * s);
    [[-14, -6], [14, -6]].forEach(([dx, dy]) => {
      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', x + dx * s); dot.setAttribute('cy', y + dy * s);
      dot.setAttribute('r', 4.5 * s); dot.setAttribute('fill', o.stroke);
      parent.appendChild(dot);
    });
    parent.appendChild(rough.svg(svg).curve(
      [[x - 14 * s, y + 16 * s], [x, y + 26 * s], [x + 14 * s, y + 16 * s]],
      {stroke: o.stroke, strokeWidth: 3, roughness: 1.2}));
    R(x, y + 38 * s, x, y + 150 * s);
    R(x, y + 150 * s, x - 34 * s, y + 218 * s);
    R(x, y + 150 * s, x + 34 * s, y + 218 * s);
    R(x, y + 70 * s, x - 56 * s, y + 118 * s);
    R(x, y + 70 * s, x + 56 * s, y + 118 * s);
  } else if (shape === 'bulb') {
    C(x, y, 96 * s, 96 * s);
    R(x - 26 * s, y + 46 * s, x + 26 * s, y + 46 * s);
    R(x - 18 * s, y + 62 * s, x + 18 * s, y + 62 * s);
    [[x, y - 76 * s, x, y - 104 * s], [x - 66 * s, y - 56 * s, x - 88 * s, y - 74 * s],
     [x + 66 * s, y - 56 * s, x + 88 * s, y - 74 * s]].forEach(([a, b, c, d]) => R(a, b, c, d));
  } else if (shape === 'chart') {
    R(x, y, x, y - 150 * s); R(x, y, x + 150 * s, y);
    const pts = [[0, -40], [34, -86], [66, -60], [104, -128], [140, -104]];
    for (let i = 0; i < pts.length - 1; i++) {
      R(x + pts[i][0] * s, y + pts[i][1] * s, x + pts[i + 1][0] * s, y + pts[i + 1][1] * s);
    }
  } else if (shape === 'gear') {
    C(x, y, 90 * s, 90 * s); C(x, y, 34 * s, 34 * s);
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      R(x + 45 * s * Math.cos(a), y + 45 * s * Math.sin(a),
        x + 66 * s * Math.cos(a), y + 66 * s * Math.sin(a));
    }
  }
}

SC.items.forEach((it, i) => {
  const el = g();
  const o = it.opts || {};
  const oo = Object.assign({}, o, {seed: it.seed || i + 1});
  const r = rough.svg(svg);
  if (it.kind === 'rect') {
    el.appendChild(r.rectangle(it.x, it.y, it.w, it.h, oo));
  } else if (it.kind === 'ellipse') {
    el.appendChild(r.ellipse(it.cx, it.cy, it.w, it.h, oo));
  } else if (it.kind === 'line') {
    el.appendChild(r.line(it.x1, it.y1, it.x2, it.y2, Object.assign({}, oo,
      it.dash ? {strokeLineDash: [14, 12]} : {})));
  } else if (it.kind === 'arrow') {
    const mx = (it.x1 + it.x2) / 2, my = (it.y1 + it.y2) / 2;
    const dx = it.x2 - it.x1, dy = it.y2 - it.y1, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L, ny = dx / L, b = it.bend || 0;
    el.appendChild(r.curve([[it.x1, it.y1], [mx + nx * b, my + ny * b], [it.x2, it.y2]], oo));
    arrowHead(el, mx + nx * b, my + ny * b, it.x2, it.y2, o.stroke, o.strokeWidth);
  } else if (it.kind === 'swoosh') {
    const y = it.y, x = it.x, w = it.w;
    el.appendChild(r.curve([[x, y], [x + w * 0.5, y + 9], [x + w, y - 4]], oo));
  } else if (it.kind === 'spark') {
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 + 0.2;
      el.appendChild(r.line(it.x + it.r * Math.cos(a), it.y + it.r * Math.sin(a),
        it.x + (it.r + 22) * Math.cos(a), it.y + (it.r + 22) * Math.sin(a), oo));
    }
  } else if (it.kind === 'sticky') {
    el.appendChild(r.rectangle(it.x, it.y, it.w, it.h, oo));
    el.appendChild(r.linearPath([[it.x + it.w - 34, it.y + it.h],
                                 [it.x + it.w, it.y + it.h - 34],
                                 [it.x + it.w, it.y + it.h]], oo));
    const t = fit(el, it.x + it.w / 2, it.y + it.h / 2 + it.size * 0.34, it.s, it.w - 34,
                  it.size, it.color, 'middle', it.rot);
    t.dataset.text = '1';
  } else if (it.kind === 'bubble') {
    el.appendChild(r.rectangle(it.x, it.y, it.w, it.h, oo));
    el.appendChild(r.linearPath([[it.x + 40, it.y + it.h],
                                 [it.x + 26, it.y + it.h + 40],
                                 [it.x + 96, it.y + it.h]], oo));
    const t = fit(el, it.x + it.w / 2, it.y + it.h / 2 + it.size * 0.34, it.s, it.w - 40,
                  it.size, it.color, 'middle', -1.4);
    t.dataset.text = '1';
  } else if (it.kind === 'text') {
    const t = it.max_w
      ? fit(el, it.x, it.y, it.s, it.max_w, it.size, it.color, it.anchor, it.rot)
      : txt(el, it.x, it.y, it.s, it.size, it.color, it.rot, it.anchor, it.weight);
    t.dataset.text = '1';
  } else if (it.kind === 'doodle') {
    doodle(el, it.shape, it.x, it.y, it.s, oo);
  }
  el.dataset.t0 = it.t0; el.dataset.dur = it.dur || 0.55;
  const paths = el.querySelectorAll('path');
  paths.forEach(p => { try { p.dataset.len = p.getTotalLength().toFixed(1); } catch (e) {} });
  el.dataset.anim = '1';
  groups.push(el);
});

const FIN = SC.duration - 0.05;

function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

function applyFrame(t) {
  groups.forEach(el => {
    const t0 = parseFloat(el.dataset.t0), dur = parseFloat(el.dataset.dur);
    const p = clamp((t - t0) / dur, 0, 1);
    const vis = p > 0;
    el.style.display = vis ? '' : 'none';
    el.querySelectorAll('path').forEach(path => {
      const len = parseFloat(path.dataset.len || 0);
      if (!len) return;
      path.style.strokeDasharray = len;
      path.style.strokeDashoffset = (len * (1 - p)).toFixed(1);
    });
    el.querySelectorAll('[data-text]').forEach(tx => {
      tx.style.opacity = clamp((t - t0 - dur * 0.55) / 0.35, 0, 1).toFixed(3);
    });
  });
  const F = SC.duration - 3.2;
  const fk = clamp((t - F) / 0.6, 0, 1);
  const fin = document.getElementById('fin');
  fin.style.opacity = fk.toFixed(3);
  document.getElementById('paper').style.opacity = (1 - fk * 0.9).toFixed(3);
  const cap = document.getElementById('cap');
  const act = CAPS.find(c => t >= c[0] && t <= c[1]);
  if (act) { cap.textContent = act[2]; cap.style.opacity = clamp((t - act[0]) / 0.25, 0, 1).toFixed(2); }
  else cap.style.opacity = '0';
}
window.applyFrame = applyFrame;
applyFrame(parseFloat(new URLSearchParams(location.search).get('t') || '0'));
</script></body></html>
